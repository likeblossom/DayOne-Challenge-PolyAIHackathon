plugins { id 'com.android.application' }
android {
    def signingFile = rootProject.file('.signing/signing.properties')
    if (signingFile.exists()) {
        def signing = new Properties()
        signingFile.withInputStream { signing.load(it) }
        signingConfigs {
            judges {
                storeFile rootProject.file('.signing/sanad-release.jks')
                storePassword signing['storePassword']
                keyAlias 'sanad'
                keyPassword signing['keyPassword']
            }
        }
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { buildConfigField 'boolean', 'DEMO_CAPTURE', 'false' }
        release {
            buildConfigField 'boolean', 'DEMO_CAPTURE', 'false'
            if (signingFile.exists()) signingConfig signingConfigs.judges
        }
        demo {
            initWith debug
            matchingFallbacks = ['debug']
            buildConfigField 'boolean', 'DEMO_CAPTURE', 'true'
            versionNameSuffix '-demo-capture'
        }
    }
    namespace 'org.dayone.midwife'
    compileSdk 35
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    defaultConfig {
        applicationId 'org.dayone.midwife'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.3.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
