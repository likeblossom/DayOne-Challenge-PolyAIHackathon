[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sanad-training"
version = "0.1.0"
description = "Training, validation and ONNX export for Sanad Android"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "Pillow>=10.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["vision_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests", "vision_pipeline/tests"]
