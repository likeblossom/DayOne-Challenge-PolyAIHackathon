[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "midwife-extractor"
version = "0.1.0"
description = "Schema-aware maternal registry field extraction, confidence, and validation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "Pillow>=10.0"
]

[project.optional-dependencies]
ocr = ["paddleocr>=3.0", "paddlepaddle>=3.3"]
dev = ["pytest>=8.0"]

[project.scripts]
midwife-extract = "midwife_extractor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/midwife_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
